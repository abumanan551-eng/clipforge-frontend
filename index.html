<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipForge - AI Shorts Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
        h1 { font-size: 1.8rem; font-weight: 800; color: #38bdf8; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 0.9rem; }
        
        .server-bar { display: flex; gap: 10px; margin-top: 15px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; color: white; }
        
        .status { margin-top: 10px; font-weight: 600; font-size: 0.85rem; }
        .status.connected { color: #4ade80; }
        .status.disconnected { color: #f87171; }
        
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: #e2e8f0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { background: #334155; color: #cbd5e1; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; }
        
        .upload-area { border: 2px dashed #475569; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; }
        .upload-area:hover { border-color: #38bdf8; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        select { width: 100%; padding: 10px; border-radius: 6px; background: #0f172a; color: white; border: 1px solid #475569; }
        
        .primary-btn { width: 100%; margin-top: 15px; padding: 14px; background: #22c55e; color: white; font-size: 1rem; }
        .primary-btn:hover { background: #16a34a; }
        
        .results-box { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        .clip-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        video { width: 100%; max-height: 400px; border-radius: 6px; background: black; }
        .loader { text-align: center; padding: 20px; color: #38bdf8; font-weight: 600; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>ClipForge Studio</h1>
        <p>Convert videos into viral shorts using your active backend server.</p>
        <div class="server-bar">
            <input type="text" id="serverUrl" placeholder="Enter backend URL (e.g. https://xxxx.trycloudflare.com)">
            <button onclick="checkConnection()">Connect</button>
        </div>
        <div id="connectionStatus" class="status disconnected">Status: Disconnected</div>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('upload')">File Upload</button>
            <button class="tab-btn" onclick="switchTab('yt')">YouTube Link</button>
        </div>

        <div id="uploadTab">
            <div class="upload-area" onclick="document.getElementById('videoFile').click()">
                <p id="fileLabel">Click or drop a video file here</p>
                <input type="file" id="videoFile" accept="video/*" style="display:none" onchange="fileSelected(this)">
            </div>
        </div>

        <div id="ytTab" style="display:none;">
            <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." style="width:100%;">
        </div>

        <div class="options-grid">
            <div>
                <label style="font-size:0.8rem; color:#94a3b8;">Caption Style</label>
                <select id="captionStyle">
                    <option value="hormozi">Alex Hormozi (Yellow/Bold)</option>
                    <option value="mrbeast">MrBeast (Red/Yellow)</option>
                    <option value="neon">Neon Green</option>
                    <option value="none">No Captions</option>
                </select>
            </div>
            <div>
                <label style="font-size:0.8rem; color:#94a3b8;">Aspect Ratio</label>
                <select id="aspectRatio">
                    <option value="9:16">9:16 (Vertical Shorts/Reels)</option>
                </select>
            </div>
        </div>

        <button class="primary-btn" id="generateBtn" onclick="processVideo()">Generate Viral Clips</button>
        <div class="loader" id="loader">Processing video... Please wait (this can take 1-2 minutes)...</div>
    </div>

    <div class="card" id="resultsCard" style="display:none;">
        <div class="section-title">Generated Clips</div>
        <div class="results-box" id="resultsContainer"></div>
    </div>
</div>

<script>
    let activeTab = 'upload';
    let selectedFile = null;

    function getServer() {
        let url = document.getElementById('serverUrl').value.trim();
        if (url.endsWith('/')) url = url.slice(0, -1);
        return url;
    }

    window.onload = function() {
        const savedUrl = localStorage.getItem('clipforge_url');
        if (savedUrl) {
            document.getElementById('serverUrl').value = savedUrl;
            checkConnection();
        }
    };

    async function checkConnection() {
        const server = getServer();
        const statusEl = document.getElementById('connectionStatus');
        if (!server) {
            statusEl.textContent = 'Please enter a server URL';
            statusEl.className = 'status disconnected';
            return;
        }
        statusEl.textContent = 'Connecting...';
        try {
            const res = await fetch(server + '/');
            const data = await res.json();
            if (data.status === 'ok') {
                statusEl.textContent = 'Connected: Server is Live!';
                statusEl.className = 'status connected';
                localStorage.setItem('clipforge_url', server);
            } else {
                throw new Error();
            }
        } catch (err) {
            statusEl.textContent = 'Connection Failed. Check backend cell!';
            statusEl.className = 'status disconnected';
        }
    }

    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (tab === 'upload') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('uploadTab').style.display = 'block';
            document.getElementById('ytTab').style.display = 'none';
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('uploadTab').style.display = 'none';
            document.getElementById('ytTab').style.display = 'block';
        }
    }

    function fileSelected(input) {
        if (input.files && input.files[0]) {
            selectedFile = input.files[0];
            document.getElementById('fileLabel').textContent = selectedFile.name;
        }
    }

    async function processVideo() {
        const server = getServer();
        if (!server) return alert('Pehle backend URL connect karein!');

        const loader = document.getElementById('loader');
        const generateBtn = document.getElementById('generateBtn');
        const resultsCard = document.getElementById('resultsCard');
        const resultsContainer = document.getElementById('resultsContainer');

        loader.style.display = 'block';
        generateBtn.disabled = true;
        resultsCard.style.display = 'none';
        resultsContainer.innerHTML = '';

        try {
            let videoData = null;

            if (activeTab === 'upload') {
                if (!selectedFile) throw new Error('File select karein');
                const formData = new FormData();
                formData.append('file', selectedFile);
                const upRes = await fetch(server + '/upload', { method: 'POST', body: formData });
                if (!upRes.ok) throw new Error('Upload fail ho gaya');
                videoData = await upRes.json();
            } else {
                const ytUrl = document.getElementById('ytUrl').value.trim();
                if (!ytUrl) throw new Error('YouTube link enter karein');
                const ytRes = await fetch(server + '/download-yt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: ytUrl })
                });
                if (!ytRes.ok) throw new Error('YouTube download fail ho gaya');
                videoData = await ytRes.json();
            }

            const cutRes = await fetch(server + '/cut', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    video_path: videoData.path,
                    video_title: videoData.title,
                    clips: videoData.clips || [],
                    aspect_ratio: document.getElementById('aspectRatio').value,
                    caption_style: document.getElementById('captionStyle').value
                })
            });

            if (!cutRes.ok) throw new Error('Video cutting fail ho gaya');
            const result = await cutRes.json();

            resultsCard.style.display = 'block';
            result.clips.forEach(clip => {
                if (clip.error) return;
                const fullUrl = server + clip.url;
                const div = document.createElement('div');
                div.className = 'clip-card';
                div.innerHTML = `
                    <h3>${clip.title}</h3>
                    <p>Virality Score: <b>${clip.score}/100</b></p>
                    <video controls src="${fullUrl}"></video>
                    <p style="color:#38bdf8;">${clip.hashtags}</p>
                    <a href="${fullUrl}" download="${clip.filename}" style="text-decoration:none;">
                        <button style="width:100%;">Download Clip</button>
                    </a>
                `;
                resultsContainer.appendChild(div);
            });

        } catch (err) {
            alert('Error: ' + err.message);
        } finally {
            loader.style.display = 'none';
            generateBtn.disabled = false;
        }
    }
</script>

</body>
</html>
